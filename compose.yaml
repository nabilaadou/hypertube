services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hypertube}
      POSTGRES_USER: ${POSTGRES_USER:-hypertube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${HYPERTUBE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 2s
      retries: 10

  server:
    build: ./server
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/pom.xml

  client:
    build: ./client
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_CLIENT_PORT:-3000}:3000"
    env_file:
      - path: ./client/.env
        required: false
    environment:
      BACKEND_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - Dockerfile
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/package-lock.json

  auth-server:
    profiles: [auth]
    build: ./auth-server
    init: true
    ports:
      - "127.0.0.1:4567:4567"
    env_file: ./auth-server/.env

volumes:
  postgres-data:
