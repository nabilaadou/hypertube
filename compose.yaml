services:
  assets:
    image: node:24-bookworm-slim
    init: true
    environment:
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://pub-4f3ad1a134a6467da45e599dfe8f48fd.r2.dev}
      ASSET_DIRECTORY: /assets
    volumes:
      - ./client/scripts/fetch-assets.mjs:/setup/fetch-assets.mjs:ro
      - landing-media:/assets/media
      - landing-models:/assets/models
    command: ["node", "/setup/fetch-assets.mjs"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${HYPERTUBE_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 2s
      retries: 10

  server:
    build: ./server
    init: true
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_HANDOFF_SECRET: ${AUTH_HANDOFF_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-10m}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-hypertube}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-hypertube-api}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-30d}
      AUTH_CLEANUP_INTERVAL: ${AUTH_CLEANUP_INTERVAL:-PT15M}
    ports:
      - "127.0.0.1:${HYPERTUBE_SERVER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/pom.xml

  client:
    build: ./client
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_CLIENT_PORT}:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL}
      AUTH_SERVER_URL: http://auth-server:4567
    depends_on:
      server:
        condition: service_healthy
      assets:
        condition: service_completed_successfully
    volumes:
      - landing-media:/app/public/media:ro
      - landing-models:/app/public/models:ro
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - Dockerfile
            - package.json
            - package-lock.json
            - public/media
            - public/models
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/package-lock.json

  auth-server:
    build: ./auth-server
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_AUTH_PORT}:4567"
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      AUTH_SERVER_URL: http://auth-server:4567
      AUTH_HANDOFF_SECRET: ${AUTH_HANDOFF_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      SPRING_INTERNAL_URL: ${SPRING_INTERNAL_URL}
      FORTY_TWO_CLIENT_ID: ${FORTY_TWO_CLIENT_ID}
      FORTY_TWO_CLIENT_SECRET: ${FORTY_TWO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  landing-media:
  landing-models:
