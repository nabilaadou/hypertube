services:
  server:
    build: ./server
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./server/src
          target: /app/src
        - action: rebuild
          path: ./server/pom.xml

  client:
    build: ./client
    init: true
    ports:
      - "127.0.0.1:${HYPERTUBE_CLIENT_PORT:-3000}:3000"
    env_file:
      - path: ./client/.env
        required: false
    environment:
      BACKEND_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - Dockerfile
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/package-lock.json
