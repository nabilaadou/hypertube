    const [x,y,width,height] = screen;
    reelPlane.style.transform = 'translate3d('+x*pull+'px,'+y*pull+'px,0) scale('+mix(1,width/w,pull)+','+mix(1,height/h,pull)+')';
    scrollCue.style.opacity = 1-range(time,0,.23);
    scrollCue.inert = openingState !== 'fullscreen';
    const edge = reduced ? (wipe > .36 ? -25 : 100) : mix(100,-24,wipe);
    timeline.style.clipPath = 'polygon(0 '+edge+'%,100% '+(edge-24*ease(range(p,.14,.90)))+'%,100% 100%,0 100%)';
    timeline.inert = p < 1.55 || p >= 5.2;
    theater.inert = p > 1.9;
    const revealPoster = range(time,.42,.91);
    featureCopy.style.opacity = revealPoster*(1-range(p,.25,.67));

    const travel = range(p,1.37,5.17);
    const shift = w*mix(0,1.56,travel);
    yearTrack.style.transform = 'translateX('+(-shift*.82)+'px)';
    field.style.backgroundPositionX = (-shift*.8)+'px';
    const firstMove = ease(range(p,.34,1.40));
    const startScale = Math.min(.63,w/1850);
    const cardScale = Math.min(1.045,w/1100,h/690);
    cards.forEach((card,i) => {
      const left = i ? w*(.52+i*.34)-shift : mix(w*.034,w*.52,firstMove)-shift;
      const top = i ? h*[0,.39,.10,.21][i] : mix(h*.48,h*.16,firstMove);
      const angle = reduced ? 0 : (i ? [0,-11,12,-9][i]*Math.cos(travel*4+i*.54) : Math.sin(firstMove*Math.PI)*83-firstMove*5);
      const scale = i ? cardScale : mix(startScale,cardScale,firstMove);
      card.style.transform = 'translate3d('+left+'px,'+top+'px,0) perspective(800px) rotateY('+angle+'deg) rotate('+angle*.07+'deg) scale('+scale+')';
      card.hidden = (i > 0 && p < 1.13) || (!i && time < .42) || left < -245 || left > w+80 || p > 5.25;
      const poster = card.querySelector('img');
      if (poster && poster.alt !== films[i].title+' poster') poster.alt = films[i].title+' poster';
      card.tabIndex = left < 0 || left > w-40 || openingState !== 'cinema' || p > 5.1 ? -1 : 0;
      card.style.opacity = i ? range(p,1.13,1.55) : revealPoster;
    });
    stage.style.setProperty('--card-caption',range(p,1.03,1.53));

    const arrive = range(p,5.0,5.48);
    const settle = ease(range(p,5.50,6.24));
    statement.style.opacity = arrive;
    statement.style.pointerEvents = arrive === 1 ? 'auto' : 'none';
    statement.inert = arrive < 1;
    quoteLock.style.transform = 'scale('+(reduced ? 1 : mix(2.72,1,settle))+')';
    quoteTitle.style.opacity = reduced ? 1 : settle;
    quoteDots.style.opacity = reduced ? 0 : 1-settle;
    quoteExtras.forEach(el => el.style.opacity = reduced ? 1 : range(p,5.99,6.25));

    const nextPhase = openingState !== 'cinema' ? openingState : p < 1.9 ? 'theater' : p < 5.38 ? 'timeline' : 'statement';
    chrome.style.color = 'var(--color-paper)';
    find('.timeline-cue').style.opacity = range(p,4.45,4.86)*(1-arrive);
    find('.timeline-cue').tabIndex = p > 4.65 ? 0 : -1;
    find('.wordmark').style.opacity = range(time,.36,.90)*(1-range(p,1.27,1.83));
    if (phase !== nextPhase) {
      phase = nextPhase;
      stage.dataset.phase = phase;
      syncVideo();
    }
    if (revealing && (time === 1 || reduced)) {
      openingState = 'cinema';
      scroller.classList.remove('is-revealing');
      scroller.focus({preventScroll:true});
      schedule();
    } else if (revealing) {
      schedule();
    }
  }

  function syncVideo() {
    if (still >= 0) return;
    const visible = !dialog.open && !motion.matches && (['fullscreen','revealing','theater'].includes(phase));
    reel.muted = !soundOn;
    if (visible && reel.paused) reel.play().catch(() => {});
    if (!visible && !reel.paused) reel.pause();
  }

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(render);
  }

  function closeMenu() {
    menu.hidden = true;
    menuButton.setAttribute('aria-expanded','false');
  }

  function startReveal() {
    closeMenu();
    if (openingState === 'cinema') {
      scroller.scrollTo({top:0,behavior:motion.matches ? 'instant' : 'smooth'});
      return;
    }
    if (openingState === 'revealing') return;
    revealStart = performance.now();
    openingState = 'revealing';
    untilWheelQuiet = true;
    scroller.scrollTop = 0;
    scroller.classList.add('is-revealing');
    schedule();
  }

  function seek(step) {
    closeMenu();
    openingState = step === 0 ? 'fullscreen' : 'cinema';
    untilWheelQuiet = false;
    scroller.classList.remove('is-revealing');
    scroller.scrollTo({top:step*stage.clientHeight,behavior:step === 0 || motion.matches ? 'instant' : 'smooth'});
    schedule();
  }

  function openScreen(trigger) {
    const film = films[Number(trigger.dataset.film)];
    const footer = find('.screening-footer');
    if (film) {
      find('#screening-title').textContent = film.title+' · Official trailer';
      const link = footer.querySelector('a');
      link.href = 'https://www.youtube.com/watch?v='+film.trailer;
      const embed = document.createElement('iframe');
      embed.src = 'https://www.youtube-nocookie.com/embed/'+film.trailer+'?rel=0&playsinline=1';
      embed.title = film.title+' official trailer';
      embed.allow = 'encrypted-media; picture-in-picture; fullscreen';
      embed.allowFullscreen = true;
      player.replaceChildren(embed);
      footer.hidden = false;
    }
    dialog.showModal();
    syncVideo();
  }

  stage.addEventListener('click', e => {
    const target = e.target.closest('button');
    if (!target) { if (e.target === dialog) dialog.close(); return; }
    if (target.dataset.seek !== undefined) seek(Number(target.dataset.seek));
    if (target.hasAttribute('data-reveal')) startReveal();
    if (target.classList.contains('logo')) seek(0);
    if (target === menuButton) {
      menu.hidden = !menu.hidden;
      menuButton.setAttribute('aria-expanded', String(!menu.hidden));
    }
    if (target === sound) {
      soundOn = !soundOn;
      sound.setAttribute('aria-pressed',String(soundOn));
      sound.setAttribute('aria-label',soundOn ? 'Turn sound off' : 'Turn sound on');
      syncVideo();
    }
    if (target.dataset.film !== undefined) openScreen(target);
    if (target.classList.contains('close-screening')) dialog.close();
  });
  dialog.addEventListener('close', () => {
    player.replaceChildren();
    syncVideo();
  });
  reel.defaultMuted = true;
  reel.addEventListener('playing', () => {
    if (exactRoom) reel.classList.add('ready');
    else window.setTimeout(() => reel.classList.add('ready'),450);
  },{once:true});
  reel.addEventListener('canplay', syncVideo);
  scroller.addEventListener('wheel', event => {
    if (dialog.open || event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    const now = performance.now();
    const idle = now-lastWheel > wheelQuietTime;
    lastWheel = now;
    if (openingState === 'fullscreen') {
      if (event.deltaY <= 0) return;
      event.preventDefault();
      startReveal();
    } else if (openingState === 'revealing' || (untilWheelQuiet && !idle)) {
      event.preventDefault();
    } else {
      untilWheelQuiet = false;
    }
  },{passive:false});

  let touchStartY = null;
  scroller.addEventListener('touchstart', event => {
    touchStartY = event.touches.length === 1 ? event.touches[0].clientY : null;
  },{passive:true});
  scroller.addEventListener('touchmove', event => {
    if (dialog.open || event.touches.length !== 1 || touchStartY === null) return;
    if (openingState === 'fullscreen' && touchStartY-event.touches[0].clientY > 10) {
      event.preventDefault();
      touchStartY = null;
      startReveal();
    } else if (openingState === 'revealing') {
      event.preventDefault();
    }
  },{passive:false});

  window.addEventListener('keydown', event => {
    if (dialog.open || event.altKey || event.ctrlKey || event.metaKey) return;
    const onButton = event.target instanceof Element && event.target.closest('button,a');
    if (onButton && event.key === ' ') return;
    if (!['ArrowDown','PageDown','End',' '].includes(event.key) || event.shiftKey) return;
    if (openingState === 'cinema') {
      if (event.repeat && untilWheelQuiet) event.preventDefault();
      else untilWheelQuiet = false;
      return;
    }
    event.preventDefault();
    startReveal();
  });

  scroller.addEventListener('scroll', () => {
    if (openingState === 'fullscreen' && scroller.scrollTop > 0) startReveal();
    schedule();
  },{passive:true});
  window.addEventListener('resize',schedule);
  motion.addEventListener('change',()=>{ syncVideo(); schedule(); });
  if (still >= 0) scroller.scrollTop = still*stage.clientHeight;
  render();
  if (still < 0) window.setTimeout(syncVideo, 1000);
})();
</script></body></html>
