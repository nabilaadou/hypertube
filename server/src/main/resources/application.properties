spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hypertube}
spring.datasource.username=${POSTGRES_USER:hypertube}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
hypertube.auth.handoff-secret=${AUTH_HANDOFF_SECRET:}
hypertube.auth.access-ttl=${AUTH_ACCESS_TTL:10m}
hypertube.auth.refresh-ttl=${AUTH_REFRESH_TTL:30d}
hypertube.auth.cleanup-interval=${AUTH_CLEANUP_INTERVAL:PT15M}
hypertube.auth.secure-cookies=${AUTH_COOKIE_SECURE:true}
hypertube.auth.jwt-secret=${AUTH_JWT_SECRET:}
hypertube.auth.jwt-issuer=${AUTH_JWT_ISSUER:hypertube}
hypertube.auth.jwt-audience=${AUTH_JWT_AUDIENCE:hypertube-api}
