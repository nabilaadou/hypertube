spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hypertube}
spring.datasource.username=${POSTGRES_USER:hypertube}
spring.datasource.password=${POSTGRES_PASSWORD:}
server.servlet.session.cookie.name=hypertube_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
hypertube.auth.handoff-secret=${AUTH_HANDOFF_SECRET:}
